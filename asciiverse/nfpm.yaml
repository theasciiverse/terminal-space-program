# System packages (.deb, .rpm, .apk, Arch) for Terminal Space Program,
# built by nfpm from the same static binary as the av archive. The release
# workflow sets VERSION, RELEASE (our packaging release) and ARCH (amd64 or
# arm64), and puts the binary at stage/terminal-space-program.
#
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries (asciiverse/CLAUDE.md).
name: terminal-space-program
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/terminal-space-program
license: MIT
description: |
  Orbital-mechanics rocket simulator for the terminal.
  Fly real rockets off the pad and into orbit by hand, plan transfers to
  the Moon and the planets, rendezvous and dock, and bring a capsule home
  under parachute, in braille graphics. By jasonfen, packaged by
  Asciiverse.
contents:
  - src: stage/terminal-space-program
    dst: /usr/bin/terminal-space-program
    file_info: { mode: 0755 }
  - src: LICENSE
    dst: /usr/share/doc/terminal-space-program/copyright
    file_info: { mode: 0644 }
  - src: NOTICE.md
    dst: /usr/share/doc/terminal-space-program/NOTICE.md
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/terminal-space-program/README.md
    file_info: { mode: 0644 }
